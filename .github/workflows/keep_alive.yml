name: Keep Streamlit App Awake

on:
  schedule:
    - cron: "41 */4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keep-streamlit-app-awake
  cancel-in-progress: true

jobs:
  keep-alive:
    if: ${{ vars.STREAMLIT_APP_URL != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install locked Node dependencies
        run: npm ci --ignore-scripts

      - name: Install Chromium browser
        run: npx playwright install --with-deps chromium

      - name: Verify the deployed application
        env:
          STREAMLIT_APP_URL: ${{ vars.STREAMLIT_APP_URL }}
        run: npm run keep-alive -- "$STREAMLIT_APP_URL"

      - name: Upload failure screenshot
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: keep-alive-screenshot
          path: keep_alive_screenshot.png
          if-no-files-found: ignore
          retention-days: 3
